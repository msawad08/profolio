<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <!-- Define a gradient for the top face -->
        <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#6a11cb;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#2575fc;stop-opacity:1" />
        </linearGradient>
    </defs>
    <!-- Top Face -->
    <polygon points="100,30 150,60 100,90 50,60" fill="url(#grad1)" />
    <!-- Left Face -->
    <polygon points="50,60 100,90 100,140 50,110" fill="#6a11cb" opacity="0.85" />
    <!-- Right Face -->
    <polygon points="100,90 150,60 150,110 100,140" fill="#2575fc" opacity="0.85" />
</svg>
